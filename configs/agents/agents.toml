# The @sentry/dotagents user-scope record. ~/.agents/agents.toml is a link to
# this file (INSTALL.md step 3), and dotagents writes through it in place, so a
# `dotagents add`, `remove`, `trust` or `mcp` change arrives here as an unstaged
# modification. agents.lock and skills/ stay in ~/.agents — see README.md.

version = 1
agents = ["claude", "vscode", "opencode"]

# Supply-chain gate: unpinned sources re-resolve to latest on every install, so
# require commits to age 7 days first. My own repo skips the gate.
minimum_release_age = 10080
minimum_release_age_exclude = ["LRNZ09/*"]

[trust]
github_orgs = ["getsentry", "LRNZ09", "mattpocock", "anthropics"]

[[skills]]
name = "dotagents"
source = "getsentry/dotagents"
ref = "3.1.0"

# getsentry/skills and anthropics/skills are an include list, one block per
# skill: nothing new arrives from upstream until it's listed here, and every
# installed skill's description costs session context. Each reason stays inline
# on its name line, because `remove` deletes the comment lines above the next
# block. `add` can't write these blocks; see README.md.
[[skills]]
name = "agents-md"          # AGENTS.md and CLAUDE.md upkeep, in every agent
source = "getsentry/skills"

[[skills]]
name = "gha-security-review" # GitHub Actions workflow exploitation review
source = "getsentry/skills"

[[skills]]
name = "secret-serialization" # secrets leaking through repr, logs and spans
source = "getsentry/skills"

[[skills]]
name = "frontend-design"     # the active copy; the Claude Code plugin is disabled
source = "anthropics/skills"

[[skills]]
name = "slack-gif-creator"   # animated GIFs sized for Slack
source = "anthropics/skills"

[[skills]]
name = "*"
source = "LRNZ09/skills"
