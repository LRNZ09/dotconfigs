# The @sentry/dotagents user-scope record. ~/.agents/agents.toml is a link to
# this file (INSTALL.md step 3), and dotagents writes through it in place, so a
# `dotagents add`, `remove`, `trust` or `mcp` change arrives here as an unstaged
# modification. agents.lock and skills/ stay in ~/.agents — see README.md.

version = 1
agents = ["claude", "opencode", "pi", "vscode"]

# Supply-chain gate: unpinned sources re-resolve to latest on every install, so
# require commits to age 7 days first. My own repo skips the gate.
minimum_release_age = 10080
minimum_release_age_exclude = ["LRNZ09/*"]

[trust]
github_orgs = ["getsentry", "LRNZ09", "mattpocock", "anthropics"]
github_repos = ["vercel-labs/skills"]

[[skills]]
name = "dotagents"
source = "getsentry/dotagents"
ref = "3.4.0"

# getsentry/skills and anthropics/skills are an include list, one block per
# skill: nothing new arrives from upstream until it's listed here, and every
# installed skill's description costs session context. Each reason stays inline
# on its name line, because `remove` deletes the comment lines above the next
# block. `add` can't write these blocks; see README.md.
[[skills]]
name = "agents-md"          # AGENTS.md and CLAUDE.md upkeep, in every agent
source = "getsentry/skills"

[[skills]]
name = "gha-security-review" # GitHub Actions workflow exploitation review
source = "getsentry/skills"

[[skills]]
name = "secret-serialization" # secrets leaking through repr, logs and spans
source = "getsentry/skills"

[[skills]]
name = "commit"             # commit messages with issue references, my most-used skill
source = "getsentry/skills"

[[skills]]
name = "create-branch"      # branch names in repos without their own convention
source = "getsentry/skills"

[[skills]]
name = "pr-writer"          # GitHub PR titles and bodies in personal repos
source = "getsentry/skills"

[[skills]]
name = "skill-scanner"      # vets a skill for injection and secrets before install
source = "getsentry/skills"

[[skills]]
name = "frontend-design"     # the only copy; the Claude Code plugin is uninstalled
source = "anthropics/skills"

[[skills]]
name = "*"
source = "LRNZ09/skills"

[[skills]]
name = "find-skills"         # search and vet skills.sh skills before adding them
source = "vercel-labs/skills"

# Matt Pocock's skills, straight from upstream: everything in engineering/,
# plus the productivity/ skills named below. in-progress/ and misc/ stay out.
# dotagents allows one wildcard per source, so productivity/ is listed by
# name, and a name Matt renames or deletes stops install: check these first.
[[skills]]
name = "*"
source = "mattpocock/skills"
path = "skills/engineering"
exclude = ["pr"]             # pr-writer owns PR bodies; the two contradict each other

[[skills]]
name = "grill-me"
source = "mattpocock/skills"

[[skills]]
name = "grilling"
source = "mattpocock/skills"

[[skills]]
name = "handoff"
source = "mattpocock/skills"

[[skills]]
name = "teach"
source = "mattpocock/skills"

[[skills]]
name = "to-questionnaire"
source = "mattpocock/skills"

[[skills]]
name = "wait-what"
source = "mattpocock/skills"

[[skills]]
name = "writing-for-agents"
source = "mattpocock/skills"
